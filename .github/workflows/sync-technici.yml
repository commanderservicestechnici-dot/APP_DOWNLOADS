name: Sync technician APKs

# Publishes the latest successful builds of managed Commander technician apps.
# Praca Technikov is copied from its stable `latest` release asset to avoid stale workflow artifacts. Current refresh: 1.10.6.
on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/sync-technici.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current APKs
        env:
          SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SOURCE_REPOS_TOKEN:-}" ]; then
            echo "SOURCE_REPOS_TOKEN nie je nastavený."
            exit 1
          fi

          export GH_TOKEN="$SOURCE_REPOS_TOKEN"
          mkdir -p downloads

          sync_release_apk() {
            REPO="$1"
            TAG="$2"
            ASSET="$3"
            OUTPUT="$4"
            TMPDIR="tmp-release-${OUTPUT%.apk}"

            rm -rf "$TMPDIR"
            mkdir -p "$TMPDIR"

            gh release download "$TAG" \
              --repo "$REPO" \
              --pattern "$ASSET" \
              --dir "$TMPDIR" \
              --clobber

            APK="$TMPDIR/$ASSET"
            if [ ! -f "$APK" ]; then
              echo "V release $TAG sa nenašiel $ASSET pre $REPO"
              exit 1
            fi

            cp "$APK" "downloads/$OUTPUT"
            echo "$REPO release $TAG -> downloads/$OUTPUT"
            sha256sum "downloads/$OUTPUT"
          }

          sync_apk() {
            REPO="$1"
            ARTIFACT="$2"
            OUTPUT="$3"
            TMPDIR="tmp-${OUTPUT%.apk}"

            RUN_ID=$(gh run list \
              --repo "$REPO" \
              --workflow android.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')

            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "Nenašiel sa úspešný build pre $REPO"
              exit 1
            fi

            rm -rf "$TMPDIR"
            mkdir -p "$TMPDIR"
            gh run download "$RUN_ID" \
              --repo "$REPO" \
              --name "$ARTIFACT" \
              --dir "$TMPDIR"

            APK=$(find "$TMPDIR" -type f -name '*.apk' | head -n 1)
            if [ -z "$APK" ]; then
              echo "V artefakte $ARTIFACT sa nenašlo APK."
              exit 1
            fi

            cp "$APK" "downloads/$OUTPUT"
            echo "$REPO run $RUN_ID -> downloads/$OUTPUT"
            sha256sum "downloads/$OUTPUT"
          }

          sync_latest_run_apk() {
            REPO="$1"
            OUTPUT="$2"
            TMPDIR="tmp-latest-${OUTPUT%.apk}"

            RUN_ID=$(gh run list \
              --repo "$REPO" \
              --branch main \
              --status success \
              --limit 20 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[0].databaseId')

            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "Nenašiel sa úspešný build pre $REPO"
              exit 1
            fi

            rm -rf "$TMPDIR"
            mkdir -p "$TMPDIR"
            gh run download "$RUN_ID" \
              --repo "$REPO" \
              --dir "$TMPDIR"

            APK=$(find "$TMPDIR" -type f -name '*.apk' | head -n 1)
            if [ -z "$APK" ]; then
              echo "V poslednom úspešnom rune $RUN_ID sa nenašlo APK pre $REPO."
              exit 1
            fi

            cp "$APK" "downloads/$OUTPUT"
            echo "$REPO latest successful run $RUN_ID -> downloads/$OUTPUT"
            sha256sum "downloads/$OUTPUT"
          }

          # Stabilné release zdroje.
          sync_release_apk "commanderservicestechnici-dot/Praca_Technikov" "latest" "Praca-Technikov.apk" "Praca-Technikov.apk"
          sync_release_apk "commanderservicestechnici-dot/Podporovane_vozidla" "latest" "Podporovane-vozidla-CAN.apk" "CMD-Obchod.apk"
          sync_release_apk "commanderservicestechnici-dot/ALL_APP" "latest" "Commander-Apps.apk" "Commander-Apps.apk"

          # Stabilné workflow artefakty.
          sync_apk "commanderservicestechnici-dot/Rai" "RAI-International-debug" "RAI.apk"
          sync_apk "commanderservicestechnici-dot/Datacho" "Datacho-Technik-debug" "Datacho-Technik.apk"
          sync_apk "commanderservicestechnici-dot/Aktivacia_Sim" "Aktivacia-SIM-debug" "Aktivacia-SIM.apk"

          # Aplikácie, kde sa názov workflow/artefaktu mení medzi verziami.
          sync_latest_run_apk "commanderservicestechnici-dot/Bungi-Darts-Android" "Bungi-Darts.apk"
          sync_latest_run_apk "commanderservicestechnici-dot/Nezabudni-Zoznam" "Nezabudni.apk"

      - name: Publish public stable links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release view technici >/dev/null 2>&1 || \
            gh release create technici \
              --title "Commander aplikácie pre technikov" \
              --notes "Automaticky synchronizované aktuálne APK z privátnych zdrojových repozitárov."

          gh release upload technici \
            downloads/Praca-Technikov.apk \
            downloads/RAI.apk \
            downloads/Datacho-Technik.apk \
            downloads/Aktivacia-SIM.apk \
            downloads/CMD-Obchod.apk \
            downloads/Commander-Apps.apk \
            downloads/Bungi-Darts.apk \
            downloads/Nezabudni.apk \
            --clobber

          echo "APP_DOWNLOADS assets:"
          gh release view technici \
            --json assets \
            --jq '.assets[] | {name,size,digest,updatedAt}'
